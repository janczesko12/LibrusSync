name: Publish iOS Release

on:
  workflow_run:
    workflows: ["iOS Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the successful iPhone build
        uses: actions/download-artifact@v4
        with:
          name: LibrusSync-iOS-unsigned-IPA
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist

      - name: Verify IPA artifact
        run: |
          set -euo pipefail
          test -s dist/LibrusSync-unsigned.ipa
          file dist/LibrusSync-unsigned.ipa

      - name: Publish release for the built version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="v1.0.${BUILD_NUMBER}"
          NOTES="Automatyczna kompilacja LibrusSync z commita ${SOURCE_SHA:0:7}.

          Plik IPA jest niepodpisany. Na iPhonie trzeba go podpisać i zainstalować przez AltStore PAL lub inny zgodny instalator."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/LibrusSync-unsigned.ipa --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/LibrusSync-unsigned.ipa --repo "$REPO" --title "LibrusSync $TAG" --notes "$NOTES"
          fi
