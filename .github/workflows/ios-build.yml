name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LibrusSync
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate app icon PNG from vector logo
        run: |
          brew install librsvg
          rsvg-convert -w 1024 -h 1024 Assets.xcassets/AppIcon.svg -o Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify WidgetKit build settings
        run: |
          set -euo pipefail
          xcodebuild -project LibrusSync.xcodeproj -target LibrusSyncWidget -configuration Debug -sdk iphoneos -showBuildSettings > /tmp/widget-build-settings.txt
          grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|GENERATE_INFOPLIST_FILE|INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier|CODE_SIGN_ENTITLEMENTS)[[:space:]]*=' /tmp/widget-build-settings.txt
          grep -q 'GENERATE_INFOPLIST_FILE = YES' /tmp/widget-build-settings.txt
          grep -q 'com.apple.widgetkit-extension' /tmp/widget-build-settings.txt

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LibrusSync.xcodeproj \
            -scheme LibrusSync \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify embedded WidgetKit metadata
        run: |
          set -euo pipefail
          WIDGET="build/DeviceDerivedData/Build/Products/Debug-iphoneos/LibrusSync.app/PlugIns/LibrusSyncWidget.appex"
          test -d "$WIDGET"
          test -f "$WIDGET/Info.plist"
          /usr/bin/plutil -lint "$WIDGET/Info.plist"
          POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET/Info.plist")
          test "$POINT" = "com.apple.widgetkit-extension"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET/Info.plist"

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          /usr/bin/ditto build/DeviceDerivedData/Build/Products/Debug-iphoneos/LibrusSync.app package/Payload/LibrusSync.app
          cd package
          /usr/bin/zip -qry "${GITHUB_WORKSPACE}/LibrusSync-unsigned.ipa" Payload
          /usr/bin/unzip -t "${GITHUB_WORKSPACE}/LibrusSync-unsigned.ipa"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project LibrusSync.xcodeproj \
            -scheme LibrusSync \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent LibrusSync.app "${GITHUB_WORKSPACE}/LibrusSync-Simulator.zip"

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: LibrusSync-iOS-unsigned-IPA
          path: LibrusSync-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: LibrusSync-iOS-Simulator
          path: LibrusSync-Simulator.zip
          if-no-files-found: error
          retention-days: 14
