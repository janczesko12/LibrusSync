name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LibrusSync (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project LibrusSync.xcodeproj \
            -scheme LibrusSync \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent LibrusSync.app "${GITHUB_WORKSPACE}/LibrusSync-Simulator.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrusSync-iOS-Simulator
          path: LibrusSync-Simulator.zip
          if-no-files-found: error
          retention-days: 14
